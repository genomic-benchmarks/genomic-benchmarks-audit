# Everything that can be checked without a network, which is everything except
# fetching the reports.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    # 3.14 is the version the site is rendered and published with, in pages.yml.
    # 3.13 and 3.12 are supported, and run the whole check here rather than the
    # tests alone: a render that differs by interpreter is the thing worth
    # catching, and 3.12 is the floor pyproject.toml declares.
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14", "3.13", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # No dependencies to cache: the package is standard library only, and dev
      # brings pytest. See pyproject.toml for why that is a property worth
      # keeping rather than an accident of being early.
      - name: Install
        run: pip install -e '.[dev]'

      - name: Tests
        run: python -m pytest tests/ tools/ -q

      # --strict fails on the warn-level rules too. Those are the words whose
      # acceptability depends on the sentence, and on a site this small the right
      # place to argue about one is a pull request, not a page.
      - name: Vocabulary
        run: python tools/vocab_check.py --strict

      # Rebuilds the catalogue in memory and compares it to the committed file,
      # then renders all 522 pages to a temporary directory. Writes nothing into
      # the checkout, so a pull request that changes a published number without
      # committing the catalogue fails here rather than quietly rendering
      # something else.
      - name: Catalogue and site
        run: gb-audit check

      - name: The build is reproducible
        run: |
          gb-audit render --out /tmp/one
          gb-audit render --out /tmp/two
          diff -r /tmp/one /tmp/two
