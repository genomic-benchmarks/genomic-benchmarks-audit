[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gb-audit"
version = "0.1.0"
description = "Render one pinned run of genomic-benchmarks-qc over the corpus as a browsable site"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Katarina Gresova" }]

# The standard library, and nothing else.
#
# That is a property worth protecting rather than an accident of being early. This
# repository renders one archived measurement run: every input is a committed file
# under `data/`, every output is text, and the whole build has to still produce the
# same bytes years after the run it describes. A dependency is a thing that can
# stop resolving, and there is no chart, table or page here that needs one --
# `charts.py` writes SVG with arithmetic, `catalogue.py` writes JSON with `json`,
# and `site.py` fills templates with `re.sub`.
#
# The one thing that does reach the network is `zenodo.py`, and it uses
# `urllib.request`. It is never on the path that renders a page.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
gb-audit = "gb_audit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# No package data, deliberately. `data/` is a site build input rather than
# something the wheel carries, for the reason `gb_leaderboard.qc` gives about its
# own snapshot: every module here takes a path and defaults to the checkout's
# `data/`, because the only thing this package does is render a repository into a
# site. Shipping the archived run inside a wheel would create a second copy that
# nothing compares against the first.
[tool.setuptools.package-data]
gb_audit = []

[tool.pytest.ini_options]
testpaths = ["tests"]
# `src` so the package imports without being installed; `.` so the tests can import
# their own shared fixtures as `tests.conftest`.
pythonpath = ["src", "."]
