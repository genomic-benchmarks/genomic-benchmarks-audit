[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gb-audit"
version = "0.1.0"
description = "Render one pinned run of genomic-benchmarks-qc over the corpus as a browsable site"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Katarina Gresova" }]

# The standard library, and nothing else.
#
# This repository renders one archived measurement run and has to still produce
# the same bytes years from now; a dependency is a thing that can stop resolving.
# `charts.py` writes SVG with arithmetic, `catalogue.py` writes JSON with `json`,
# `site.py` fills templates with `re.sub`, and `zenodo.py` -- the one thing that
# reaches a network, never on the path that renders a page -- uses
# `urllib.request`.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
gb-audit = "gb_audit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# No package data. `data/` is a build input rather than something the wheel
# carries: every module takes a path and defaults to the checkout's `data/`, and
# shipping the archived run inside a wheel would be a second copy nothing compares
# against the first.
[tool.setuptools.package-data]
gb_audit = []

[tool.pytest.ini_options]
testpaths = ["tests"]
# `src` so the package imports without being installed; `.` so the tests can import
# their own shared fixtures as `tests.conftest`.
pythonpath = ["src", "."]
