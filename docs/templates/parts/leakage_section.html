<section class="figures" id="leakage">
  <h2>Split comparisons</h2>
  {{fig_leakage}}
  <table class="listing">
    <caption>
      Each pair, in both directions. The two percentages differ whenever the two
      splits differ in size, so both are shown rather than the larger one.
    </caption>
    <thead>
      <tr>
        <th scope="col">Comparison</th>
        <th scope="col">Flag</th>
        <th scope="col" class="right">Of the first split</th>
        <th scope="col" class="right">Of the second</th>
      </tr>
    </thead>
    <tbody>
{{leakage_rows}}
    </tbody>
  </table>
</section>
